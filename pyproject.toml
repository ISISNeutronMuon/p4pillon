[project]
name = "p4pillon"
dynamic = ["version"]
description = "Extensions to the p4p Server API, to aid in creation and managment of pvAccess servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "p4p>=4.2.1",
    "pyyaml>=6.0.3",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Typing :: Typed"
]
license = "BSD-3-Clause"
keywords = ["pva", "pvaccess", "p4p", "epics"]
authors = [
  {name = "Ivan Finch", email = "ivan.finch@stfc.ac.uk"},
  {name = "Ajit Kurup", email = "a.kurup@imperial.ac.uk"},
  {name = "Kathryn Baker", email = "k.baker@stfc.ac.uk"},
  {name = "Aqeel AlShafei", email = "aqeel.alshafei@stfc.ac.uk"}
]
maintainers = [
  {name = "Ivan Finch", email = "ivan.finch@stfc.ac.uk"},
]

[project.urls]
Homepage = "https://github.com/ISISNeutronMuon/p4pillon"
Repository = "https://github.com/ISISNeutronMuon/p4pillon"
Issues = "https://github.com/ISISNeutronMuon/p4pillon/issues"
Documentation = "https://isisneutronmuon.github.io/p4pillon/"

[dependency-groups]
test = [
  "ruff>=0.15.21",
  "coverage>=7.15.1",
  "pytest>=9.1.1",
]
dist = [
    "build>=1.5.1",
    "twine>=6.1.0",
]
dev = [
  {include-group = "test"},
  {include-group = "dist"},
]

## Build system configuration
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[tool.hatch.build.targets.wheel]
packages = ["p4pillon/"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

## Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["p4pillon"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

## Linting configuration
[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120

[tool.ruff.lint]
extend-select = [
  "UP",    # pyupgrade
  "I",     # isort
  "B",     # flake8-bugbear
  "ASYNC", # flake8-async
  "SIM",   # flake8-simplify
  "RUF",   # ruff-specific rules
]
# Not yet enabled due to a backlog of pre-existing violations: ARG, N, C4, PTH
ignore = [
  "B024", # Several base classes (BaseRule, Handler, Server) intentionally define
  "B027", # only optional, overridable hook methods with no required abstract methods.
]


